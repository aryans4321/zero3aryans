<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Inventory, sales, and workforce management for Zero3Aryans.">
<meta name="application-name" content="Zero3Aryans Inventry and Sale Manager">
<meta name="theme-color" content="#f4f6fb">
<title>Zero3Aryans Inventry and Sale Manager</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/app-icon.svg" type="image/svg+xml">

<style>
:root {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --panel-alt: #f8fafc;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --primary: #5959d9;
    --primary-strong: #4b4bbd;
    --shadow: rgba(15, 23, 42, 0.08);
    --dark-overlay: rgba(0, 0, 0, 0.55);
    --input-bg: #ffffff;
}

body.theme-dark {
    --bg: #0b1120;
    --panel: #111827;
    --panel-alt: #0f172a;
    --text: #edf2ff;
    --muted: #9aa4b2;
    --border: #253046;
    --primary: #7c7cff;
    --primary-strong: #8f8fff;
    --shadow: rgba(0, 0, 0, 0.28);
    --dark-overlay: rgba(2, 6, 23, 0.7);
    --input-bg: #0f172a;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.2s ease, color 0.2s ease;
}

body.auth-locked .header {
    display: none;
}

.auth-shell {
    width: min(100% - 32px, 460px);
    margin: 7vh auto;
}

.auth-brand {
    margin-bottom: 20px;
    color: var(--primary);
    font-size: 23px;
    font-weight: 800;
}

.auth-panel {
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: 0 12px 32px var(--shadow);
}

.auth-panel h1 {
    margin: 0 0 8px;
    font-size: 25px;
}

.auth-panel p {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
}

.auth-form {
    display: grid;
    gap: 12px;
}

.auth-form input,
.auth-form select {
    width: 100%;
    padding: 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--text);
}
.password-input {
    position: relative;
    width: 100%;
}
.password-input input {
    padding-right: 68px !important;
}
.password-toggle {
    position: absolute;
    top: 50%;
    right: 10px;
    transform: translateY(-50%);
    border: 0;
    padding: 4px;
    background: transparent;
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.auth-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.auth-link {
    border: 0;
    padding: 6px 0;
    background: transparent;
    color: var(--primary);
    font-weight: 700;
}

.auth-notice {
    display: none;
    margin: 12px 0 0;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--panel-alt);
    color: var(--text);
    font-size: 13px;
}

.auth-notice.visible {
    display: block;
}

button, input, select {
    font: inherit;
}

.header {
    background: var(--panel);
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
}

.header-left {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.header-account {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 11px;
}

.header-account-label {
    margin-right: 4px;
    font-size: 9px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
}

.header-account strong {
    color: var(--text);
    font-weight: 700;
}

.logo {
    font-size: 23px;
    font-weight: 800;
    color: var(--primary);
}

.logo small {
    display: block;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px 16px 100px;
}

.hero {
    background: linear-gradient(135deg,#171738,#6666e5);
    color: white;
    padding: 25px;
    border-radius: 25px;
    margin-bottom: 18px;
}

.hero small {
    opacity: .7;
}

.hero h1 {
    margin: 7px 0 15px;
    font-size: 35px;
}

.cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.card {
    background: var(--panel);
    border-radius: 18px;
    padding: 17px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px var(--shadow);
}

.card-title {
    font-size: 12px;
    color: var(--muted);
}

.card-value {
    font-size: 24px;
    font-weight: 800;
    margin-top: 7px;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 18px 0;
}

.action {
    border: 0;
    background: var(--panel);
    color: var(--text);
    border-radius: 18px;
    padding: 20px;
    text-align: left;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 5px 20px var(--shadow);
}

.action.primary {
    background: var(--primary);
    color: white;
}

.admin-dashboard-action {
    grid-column: 1 / -1;
}

.action-icon {
    font-size: 25px;
    display: block;
    margin-bottom: 8px;
}

.section {
    margin-top: 25px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.section-header h2 {
    font-size: 18px;
}

button {
    cursor: pointer;
}

.primary-button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 13px 17px;
    border-radius: 13px;
    font-weight: 700;
}

.secondary-button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 13px 17px;
    border-radius: 13px;
    font-weight: 700;
}

.search {
    width: 100%;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 13px;
    margin-bottom: 12px;
    outline: none;
    background: var(--panel);
    color: var(--text);
}

.product {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 17px;
    padding: 15px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
}

.product-name {
    font-weight: 800;
}

.product-info {
    font-size: 12px;
    color: #6b7280;
    margin-top: 5px;
}

.badge {
    display: inline-block;
    padding: 5px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 800;
    margin-top: 7px;
}

.green {
    background: #e7f8ef;
    color: #087443;
}

.red {
    background: #ffebe9;
    color: #b42318;
}

.orange {
    background: #fff2d8;
    color: #9a6700;
}

.form {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
}

.field input,
.field select {
    width: 100%;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--input-bg);
    color: var(--text);
    outline: none;
}

.two {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.total {
    background: #eeeeff;
    padding: 18px;
    border-radius: 17px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.total strong {
    font-size: 26px;
}

.payment {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.payment button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 16px;
    font-weight: 800;
}

.payment button.selected {
    border: 2px solid var(--primary);
    background: rgba(89, 89, 217, 0.12);
    color: var(--primary-strong);
}

.modal {
    position: fixed;
    inset: 0;
    background: var(--dark-overlay);
    display: flex;
    align-items: flex-end;
    z-index: 100;
}

.modal.hidden {
    display: none;
}

.modal-box {
    background: var(--panel);
    color: var(--text);
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 22px;
    border-radius: 25px 25px 0 0;
    max-height: 90vh;
    overflow: auto;
}

.qr {
    width: 220px;
    height: 220px;
    margin: 20px auto;
    background:
    repeating-conic-gradient(
        #111 0 25%,
        white 0 50%
    ) 50% / 18px 18px;
    border: 10px solid white;
    box-shadow: 0 0 0 1px #ddd;
}

.center {
    text-align: center;
}

.empty {
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: 17px;
    padding: 35px;
    text-align: center;
    color: var(--muted);
}

.history-filters {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
    gap: 10px;
    align-items: end;
}

.history-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 16px;
}

.history-tabs button {
    flex: 0 0 auto;
}

.history-tabs button.active {
    background: var(--primary);
    color: #fff;
}

.history-table-wrap {
    overflow-x: auto;
}

.history-table {
    width: 100%;
    min-width: 760px;
    border-collapse: collapse;
    text-align: left;
}

.history-table th,
.history-table td {
    padding: 11px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
}

.history-table th {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
}

.history-mobile-list {
    display: none;
}

.history-mobile-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 12px;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
}

.history-mobile-row small {
    color: var(--muted);
}

.incentive-progress-list {
    display: grid;
    gap: 8px;
    margin-top: 10px;
}

.incentive-progress-row {
    display: grid;
    grid-template-columns: minmax(90px, 0.7fr) minmax(90px, 1fr) minmax(150px, auto);
    align-items: center;
    gap: 8px;
}

.incentive-progress-row progress {
    width: 100%;
    height: 10px;
    accent-color: var(--primary);
}

.incentive-progress-row small {
    color: var(--muted);
}

.cloud-status {
    display: inline-block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 10px;
}

@media(max-width:500px) {
    .cards {
        grid-template-columns: 1fr 1fr;
    }

    .two {
        grid-template-columns: 1fr 1fr;
    }

    .admin-shell {
        grid-template-columns: 1fr;
    }

    .admin-sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 56px 10px 10px;
    }

    .sidebar-menu {
        display: flex;
        overflow-x: auto;
        margin: 4px -2px 0;
        padding-bottom: 4px;
    }

    .sidebar-menu button {
        flex: 0 0 auto;
        white-space: nowrap;
        padding: 10px 11px;
    }

    .sidebar-utility {
        display: flex;
        flex-wrap: wrap;
        margin-top: 8px;
        padding-top: 8px;
    }

    .admin-main {
        min-width: 0;
        padding: 12px;
    }

    .history-filters {
        grid-template-columns: 1fr 1fr;
    }

    .history-filters button {
        grid-column: 1 / -1;
    }

    .history-table-wrap {
        display: none;
    }

    .history-mobile-list {
        display: block;
    }

    .incentive-progress-row {
        grid-template-columns: 1fr;
        gap: 4px;
    }
}

.admin-shell {
    position: relative;
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 74px);
}

.admin-shell.sidebar-collapsed {
    grid-template-columns: minmax(0, 1fr);
}

.admin-shell.sidebar-collapsed .admin-sidebar {
    display: none;
}

.admin-shell.sidebar-collapsed .admin-main {
    padding-top: 64px;
}

.admin-sidebar {
    position: sticky;
    top: 0;
    align-self: start;
    height: calc(100vh - 74px);
    overflow-y: auto;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 56px 14px 18px;
}

.sidebar-toggle {
    position: absolute;
    top: 12px;
    left: 14px;
    z-index: 2;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted);
    font-size: 24px;
    line-height: 1;
}

.sidebar-toggle:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
}

.sidebar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px 18px;
    font-weight: 800;
    color: var(--text);
}

.brand-mark {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), #7c7cff);
    color: white;
    font-size: 22px;
    box-shadow: 0 12px 24px rgba(89, 89, 217, 0.2);
}

.sidebar-brand small {
    display: block;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.6px;
}

.sidebar-menu {
    display: grid;
    gap: 8px;
    margin-top: 8px;
}

.sidebar-menu button,
.sidebar-utility button {
    border: none;
    background: transparent;
    color: var(--muted);
    text-align: left;
    border-radius: 12px;
    padding: 12px 14px;
    font-weight: 700;
}

.sidebar-menu button.active {
    background: rgba(89, 89, 217, 0.12);
    color: var(--primary);
}

.sidebar-utility {
    display: grid;
    gap: 8px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
}

body.admin-workspace .header #logoutButton,
body.admin-workspace .header #settingsButton {
    display: none;
}

.admin-main {
    padding: 20px;
}

.admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
}

.admin-header h1 {
    margin: 0;
    font-size: 28px;
}

.admin-action-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.admin-panel-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
}

.summary-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 8px 22px var(--shadow);
}

.summary-card .label {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
}

.summary-card .big {
    margin-top: 12px;
    font-size: 30px;
    font-weight: 800;
}

.summary-card .sub {
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
}

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 8px 22px var(--shadow);
}

.panel h3 {
    margin: 0 0 14px;
    font-size: 18px;
}

.team-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
}

.team-row:last-child {
    border-bottom: none;
}

.team-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.team-id {
    font-size: 11px;
    letter-spacing: 0.8px;
    color: var(--muted);
    text-transform: uppercase;
}

.status-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
}

.status-pill.active {
    background: #eafaf1;
    color: #136c43;
}

.status-pill.inactive {
    background: #fff0ee;
    color: #b42318;
}

.mini-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
}

.mini-actions button {
    border: 1px solid var(--border);
    background: var(--panel-alt);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 11px;
    font-weight: 700;
}

.metric-stack {
    display: grid;
    gap: 12px;
}

.metric-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
}

.metric-box strong {
    font-size: 18px;
}

.incentive-list,
.payment-list {
    display: grid;
    gap: 10px;
    margin-top: 12px;
}

.payment-transaction-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(130px, 1fr) auto;
    align-items: center;
}

.payment-reference-column {
    display: grid;
    gap: 4px;
    min-width: 0;
}

.payment-reference-column small {
    color: var(--muted);
}

.incentive-item,
.payment-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel-alt);
}

.input-stack {
    display: grid;
    gap: 10px;
}

.inline-form {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
    gap: 10px;
    align-items: end;
}

.password-grid {
    display: grid;
    gap: 10px;
    margin-top: 12px;
}

.password-box {
    display: grid;
    grid-template-columns: 1.4fr 1fr auto auto auto;
    gap: 8px;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel-alt);
}

.password-box input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 10px;
    background: var(--input-bg);
    color: var(--text);
}

.form-button {
    border: none;
    border-radius: 12px;
    padding: 11px 14px;
    background: var(--primary);
    color: white;
    font-weight: 700;
}

.danger-button {
    border: 1px solid #f5b7b1;
    background: #fff3f1;
    color: #b42318;
    border-radius: 10px;
    padding: 9px 12px;
    font-weight: 700;
}

.success-button {
    border: none;
    background: #e7f8ef;
    color: #087443;
    border-radius: 10px;
    padding: 9px 12px;
    font-weight: 700;
}

@media(max-width:800px) {
    .admin-panel-grid {
        grid-template-columns: 1fr;
    }

    .inline-form {
        grid-template-columns: 1fr 1fr;
    }

    .password-box {
        grid-template-columns: 1fr;
    }
}

@media(max-width:520px) {
    .payment-transaction-row {
        grid-template-columns: 1fr auto;
    }

    .payment-reference-column {
        grid-column: 1 / -1;
        grid-row: 2;
    }
}

@media(max-width:700px) {
    .admin-shell {
        grid-template-columns: minmax(0, 1fr);
    }

    .admin-sidebar {
        position: sticky;
        top: 0;
        z-index: 5;
        height: auto;
        max-height: none;
        overflow: visible;
        padding: 56px 10px 10px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
    }

    .sidebar-menu {
        display: flex;
        overflow-x: auto;
        margin: 4px -2px 0;
        padding-bottom: 4px;
    }

    .sidebar-menu button {
        flex: 0 0 auto;
        white-space: nowrap;
        padding: 10px 11px;
    }

    .sidebar-utility {
        display: flex;
        flex-wrap: wrap;
        margin-top: 8px;
        padding-top: 8px;
    }

    .admin-main {
        min-width: 0;
        padding: 12px;
    }

    .admin-header {
        flex-wrap: wrap;
        gap: 10px;
    }

    .history-filters {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .history-filters button {
        grid-column: 1 / -1;
    }

    .history-table-wrap {
        display: none;
    }

    .history-mobile-list {
        display: block;
    }

    .incentive-progress-row {
        grid-template-columns: 1fr;
        gap: 4px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="header-left">

function getSharedState() {
    return {
        products,
        inventoryRequests,
        locations,
        workers,
        warehouseStock,
        workerInventory,
        workerProfiles,
        workerStatus,

        upiPayeeName,
        paymentBankName,
        paymentAccountHolder,
        paymentAccountNumber,
        paymentIfscCode,
        upiQrDurationMinutes
    };
}

function applySharedState(data) {
    products = Array.isArray(data.products) ? data.products : products;
    inventoryRequests = Array.isArray(data.inventoryRequests) ? data.inventoryRequests : inventoryRequests;
    locations = Array.isArray(data.locations) ? data.locations : locations;
    workers = Array.isArray(data.workers) ? data.workers : workers;
    warehouseStock = data.warehouseStock && typeof data.warehouseStock === "object" ? data.warehouseStock : warehouseStock;
    workerInventory = data.workerInventory && typeof data.workerInventory === "object" ? data.workerInventory : workerInventory;
    workerProfiles = data.workerProfiles && typeof data.workerProfiles === "object" ? data.workerProfiles : workerProfiles;
    workerStatus = data.workerStatus && typeof data.workerStatus === "object" ? data.workerStatus : workerStatus;
    workerIds = data.workerIds && typeof data.workerIds === "object" ? data.workerIds : workerIds;
    incentiveList = Array.isArray(data.incentives) ? data.incentives : incentiveList;
    payrollRecords = data.payrollRecords && typeof data.payrollRecords === "object" ? data.payrollRecords : payrollRecords;
    upiPaymentId = data.upiPaymentId || "";

    paymentBankName = data.paymentBankName || "";
    paymentAccountHolder = data.paymentAccountHolder || "";

    setWorkspaceItem("paymentIfscCode", paymentIfscCode);
    setWorkspaceItem("upiQrDurationMinutes", String(upiQrDurationMinutes));
    applyingSharedData = false;
}

function getSharedRecordId(record, index) {
    const id = record.id ?? `${record.worker || "record"}-${record.cycle || record.paidAt || record.time || index}`;
    return String(id).replaceAll("/", "_");
}

function getSharedHistoryCollections() {
    return {
        sales,
        warehouseMovements,
        activityLog,
        payrollHistory
    };
}

async function writeSharedHistory(collectionName, records) {
    const fingerprints = sharedRecordFingerprints[collectionName];
    const collection = sharedWorkspaceRef.collection(collectionName);
    let batch = firebase.firestore().batch();
    let batchSize = 0;
    const committedRecords = [];

    for (const [index, record] of records.entries()) {
        const id = getSharedRecordId(record, index);
        const serialized = JSON.stringify(record);
        if (fingerprints.get(id) === serialized) continue;
        batch.set(collection.doc(id), JSON.parse(serialized));
        committedRecords.push([id, serialized]);
        batchSize += 1;
        if (batchSize === 400) {
            await batch.commit();
            committedRecords.forEach(([key, value]) => fingerprints.set(key, value));
            committedRecords.length = 0;
            batch = firebase.firestore().batch();
            batchSize = 0;
        }
    }

    if (batchSize) {
        await batch.commit();
        committedRecords.forEach(([key, value]) => fingerprints.set(key, value));
    }
}

async function saveSharedData() {
    if (!sharedDataReady || !sharedWorkspaceRef || !firebase.auth().currentUser) return;
    const state = getSharedState();
    await sharedWorkspaceRef.collection("records").doc("state").set({
        ...state,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy: firebase.auth().currentUser.uid
    });
    for (const [collectionName, records] of Object.entries(getSharedHistoryCollections())) {
        await writeSharedHistory(collectionName, records);
    }
    setSharedStatus("Synced");
}

function scheduleSharedSave() {
    if (!sharedDataReady || applyingSharedData) return;
    clearTimeout(sharedSaveTimer);
    setSharedStatus("Saving");
    sharedSaveTimer = setTimeout(() => {
        saveSharedData().catch(error => {
            setSharedStatus("Sync error");
            console.error("Could not sync business data.", error);
        });
    }, 500);
}

function setSharedStatus(message) {
    const status = document.getElementById("cloudStatus");
    if (status) status.textContent = message;
}

async function connectSharedWorkspaceForSession(role) {
    setSharedStatus("Connecting");
    try {
        await initializeSharedWorkspace(role);
        setSharedStatus("Synced");
    } catch (error) {
        setSharedStatus(error.code === "permission-denied" ? "Firestore rules needed" : "Cloud setup needed");
        console.warn("Shared data is not connected.", error);
    }
}

function stopSharedListeners() {
    sharedUnsubscribers.forEach(unsubscribe => unsubscribe());
    sharedUnsubscribers = [];
    sharedDataReady = false;
    sharedWorkspaceRef = null;
}

function applySharedHistory(collectionName, snapshot) {
    const records = snapshot.docs.map(document => document.data());
    records.sort((left, right) => new Date(right.time || right.paidAt || 0) - new Date(left.time || left.paidAt || 0));
    const current = getSharedHistoryCollections()[collectionName];
    if (JSON.stringify(current) === JSON.stringify(records)) return;

    const fingerprints = sharedRecordFingerprints[collectionName];
    fingerprints.clear();
    records.forEach((record, index) => fingerprints.set(getSharedRecordId(record, index), JSON.stringify(record)));
    if (collectionName === "sales") sales = records;
    if (collectionName === "warehouseMovements") warehouseMovements = records;
    if (collectionName === "activityLog") activityLog = records;
    if (collectionName === "payrollHistory") payrollHistory = records;
    applyingSharedData = true;
    saveData();
    applyingSharedData = false;
    refreshSharedPage();
}

function refreshSharedPage() {
    if (document.activeElement?.matches("input, select, textarea")) return;
    if (activePage === "history") historyPage();
    if (activePage === "sales") salesPage();
    if (activePage === "incentives") incentivesPage();
    if (activePage === "admin" && hasAdminAccess()) adminPage();
}

async function initializeSharedWorkspace(role) {
    stopSharedListeners();
    Object.values(sharedRecordFingerprints).forEach(fingerprints => fingerprints.clear());
    const user = firebase.auth().currentUser;
    if (!user) throw new Error("Sign in again to connect this device to shared storage.");

    if (!activeWorkspaceId) throw new Error("This account is not assigned to an admin workspace.");
    sharedWorkspaceRef = firebase.firestore().collection("businessWorkspaces").doc(activeWorkspaceId);
    const stateRef = sharedWorkspaceRef.collection("records").doc("state");
    let stateSnapshot = await stateRef.get();
    if (!stateSnapshot.exists) {
        if (role !== "admin") throw new Error("The administrator must sign in first to set up shared business data.");
        await stateRef.set({
            ...getSharedState(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedBy: user.uid
        });
        for (const [collectionName, records] of Object.entries(getSharedHistoryCollections())) {
            await writeSharedHistory(collectionName, records);
        }
    } else {
        applySharedState(stateSnapshot.data());
    }

    for (const collectionName of Object.keys(getSharedHistoryCollections())) {
        const historySnapshot = await sharedWorkspaceRef.collection(collectionName).get();
        applySharedHistory(collectionName, historySnapshot);
    }
    sharedDataReady = true;

    sharedUnsubscribers.push(stateRef.onSnapshot(snapshot => {
        if (!snapshot.exists || snapshot.metadata.hasPendingWrites) return;
        const data = snapshot.data();
        if (data.updatedBy === firebase.auth().currentUser?.uid) return;
        applySharedState(data);
        refreshSharedPage();
    }));
    for (const collectionName of Object.keys(getSharedHistoryCollections())) {
        sharedUnsubscribers.push(sharedWorkspaceRef.collection(collectionName).onSnapshot(snapshot => {
            applySharedHistory(collectionName, snapshot);
        }));
    }
}

function getCurrentAdminAccountId() {
    let savedSession;
    try {
        savedSession = JSON.parse(localStorage.getItem("authSession") || "null");
    } catch {
        savedSession = null;
    }
    const account = authAccounts.find(item => item.id === savedSession?.accountId);
    return account?.role === "admin" ? account.id : "";
}

function getCurrentAdminAccount() {
    const accountId = getCurrentAdminAccountId();
    const account = authAccounts.find(item => item.id === accountId && item.role === "admin");
    return account && isAccountInCurrentWorkspace(account) ? account : null;
}

function getAdminSubscriptionStatus(record = adminSubscriptions[getCurrentAdminAccountId()]) {
    if (record?.paidUntil && Number(record.paidUntil) > Date.now()) return "paid";
    if (!record?.trialStartedAt) return "not-started";
    return Number(record.trialEndsAt) > Date.now() ? "trial" : "expired";
}

function formatSubscriptionDate(timestamp) {
    return new Date(Number(timestamp)).toLocaleDateString(undefined, {
        year: "numeric",
        month: "long",
        day: "numeric"

}

function subscriptionPlanList() {

function renderAdminSubscription(message = "") {
    if (currentUserRole !== "admin") return;
    const accountId = getCurrentAdminAccountId();
    if (!accountId) {
        renderAuthPage("Sign in again to view subscription details.");
        return;

    const isPaid = status === "paid";

        ? `Your trial is active until ${formatSubscriptionDate(record.trialEndsAt)}. No payment is due during the trial.`
        : isPaid
            ? `Your subscription is active until ${formatSubscriptionDate(record.paidUntil)}.`
            : status === "expired"
                ? "Your trial has ended. Choose a plan and pay using UPI or QR."
                : "Start your one-time 15-day free trial whenever you are ready.";

    document.body.classList.add("auth-locked");
    document.getElementById("app").innerHTML = `
        <main class="auth-shell" style="max-width:560px;">
            <div class="auth-brand">Zero3Aryans</div>
            <section class="auth-panel">
                <h1>${status === "expired" ? "Choose a subscription" : "Trial and subscription"}</h1>
                <p>${trialDescription}</p>
                <h2 style="font-size:16px;margin:18px 0 0;">Plans after the trial</h2>
                ${subscriptionPlanList()}
                ${status === "not-started" ? `
                    <button class="primary-button" type="button" onclick="startAdminFreeTrial()">Start 15-day free trial</button>
                ` : ""}
                ${isTrial || isPaid ? `
                    <button class="secondary-button" type="button" onclick="adminPage()">Back to app</button>
                ` : ""}
                ${status === "expired" ? `
                    <form class="auth-form" onsubmit="showSubscriptionPayment(event)">
                        <label for="subscriptionPlan">Select plan</label>
                        <select id="subscriptionPlan" name="plan" required>
                            ${ADMIN_SUBSCRIPTION_PLANS.map(plan => `<option value="${plan.id}">${plan.label} - ₹${plan.amount}</option>`).join("")}

                <div id="subscriptionPaymentDetails"></div>
                ${message ? `<div class="auth-notice visible" role="status">${escapeHtml(message)}</div>` : ""}
                <p style="margin-top:16px;font-size:11px;">This preview stores trial status in this browser. Firebase account syncing and secure UPI payment verification are not connected yet.</p>
            </section>
        </main>
    `;
}

function startAdminFreeTrial() {
    if (currentUserRole !== "admin") return;
    const accountId = getCurrentAdminAccountId();
    if (!accountId) return renderAdminSubscription("Sign in again to start your trial.");

    if (adminSubscriptions[accountId]?.trialStartedAt) {
        return renderAdminSubscription("The free trial has already been used for this account.");
    }

    const trialStartedAt = Date.now();
    adminSubscriptions[accountId] = {
        trialStartedAt,
        trialEndsAt: trialStartedAt + 15 * 24 * 60 * 60 * 1000
    };
    saveData();
    adminPage();
}

function showSubscriptionPayment(event) {
    event.preventDefault();
    if (currentUserRole !== "admin" || getAdminSubscriptionStatus() !== "expired") return;

    const data = new FormData(event.target);
    const plan = ADMIN_SUBSCRIPTION_PLANS.find(item => item.id === data.get("plan"));
    const details = document.getElementById("subscriptionPaymentDetails");
    if (!plan || !details) return;

    const paymentUrl = `upi://pay?pa=${encodeURIComponent(ADMIN_SUBSCRIPTION_UPI_ID)}&pn=${encodeURIComponent("Zero3Aryans")}&am=${plan.amount.toFixed(2)}&cu=INR&tn=${encodeURIComponent(`Zero3Aryans ${plan.label} subscription`)}`;
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(paymentUrl)}`;
    details.innerHTML = `
        <section class="center" style="margin-top:20px;">
            <h2 style="font-size:18px;">Pay ₹${plan.amount} for ${plan.label}</h2>
            <p>UPI ID: <strong>${ADMIN_SUBSCRIPTION_UPI_ID}</strong></p>
            <img src="${qrUrl}" width="240" height="240" alt="UPI QR code for ₹${plan.amount}" style="max-width:100%;">
            <p><a class="primary-button" href="${paymentUrl}" style="display:inline-block;text-decoration:none;">Open UPI app</a></p>
            <p class="product-info">After paying, the founder must verify the transaction and activate the plan. This preview cannot verify or record payments yet. No card payments are offered.</p>
        </section>
    `;
}

function ensureAuthData() {
    if (!getWorkspaceItem("warehouseStock")) {
        warehouseStock = Object.fromEntries(products.map(product => [
            product.id,
            Math.max(0, Number(product.working || 0) - getSold(product.id))
        ]));
    }

    if (!workers.some(worker => workerProfiles[worker] === "manager")) {
        const managerName = workers.find(worker => worker.toLowerCase() === "manager") || "Manager";
        if (!workers.includes(managerName)) workers.push(managerName);
        workerProfiles[managerName] = "manager";
        workerStatus[managerName] = true;
    }

    workers.forEach((worker, index) => {
        if (!workerProfiles[worker]) {
            workerProfiles[worker] = "assistant";
        }

        if (workerStatus[worker] === undefined) {
            workerStatus[worker] = true;
        }

            if (!workerIds[worker]) {
            workerIds[worker] = `W-${String(index + 1).padStart(3, "0")}`;
        }
    });

    if (!workerStatus.admin) {
        workerStatus.admin = true;
    }

    saveData();
}

        location: details.location || selectedLocation || "Main Store",
        time: new Date().toISOString()

    saveData();
}

function isInactiveStaffAccount(account) {
    return account?.role !== "admin" && Boolean(account?.workerName) && workerStatus[account.workerName] === false;
}

function isAccountInCurrentWorkspace(account) {
    return Boolean(activeWorkspaceId) && getWorkspaceIdForAccount(account) === activeWorkspaceId;
}

function createAuthSalt() {
    return Array.from(crypto.getRandomValues(new Uint8Array(16)))
        .map(value => value.toString(16).padStart(2, "0"))
        .join("");
}

async function hashAuthPassword(password, salt) {
    if (!crypto.subtle) throw new Error("Secure password hashing is not available in this browser.");
    const key = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveBits"]
    );
    const bits = await crypto.subtle.deriveBits({
        name: "PBKDF2",
        salt: new TextEncoder().encode(salt),
        iterations: 120000,
        hash: "SHA-256"
    }, key, 256);
    return Array.from(new Uint8Array(bits)).map(value => value.toString(16).padStart(2, "0")).join("");
}

function getFirebaseLoginEmail(username) {
    const bytes = new TextEncoder().encode(String(username || "").trim().toLowerCase());
    const usernameKey = Array.from(bytes)
        .map(value => value.toString(16).padStart(2, "0"))
        .join("");
    return `user-${usernameKey}@zero3aryans-inventry.firebaseapp.com`;
}

function getFirebaseAccountMetadata(account) {
    return JSON.stringify({
        role: account.role,
        workerName: account.workerName || "",
        username: account.username || account.email || "",
        ownerAdminId: account.ownerAdminId || ""
    });
}

async function provisionFirebaseLogin(account, password, allowExisting = true) {
    let provisioningApp = firebase.apps.find(app => app.name === "staff-provisioning");
    if (!provisioningApp) {
        provisioningApp = firebase.initializeApp(firebaseConfig, "staff-provisioning");
    }

    const provisioningAuth = provisioningApp.auth();
    let credential;
    let createdAccount = false;
    try {
        try {
            credential = await provisioningAuth.createUserWithEmailAndPassword(
                getFirebaseLoginEmail(account.username || account.email),
                password
            );
            createdAccount = true;
        } catch (error) {
            if (error.code !== "auth/email-already-in-use") throw error;
            if (!allowExisting) throw error;
            credential = await provisioningAuth.signInWithEmailAndPassword(
                getFirebaseLoginEmail(account.username || account.email),
                password
            );
        }
        if (!createdAccount) {
            const existingMetadata = readFirebaseAccountMetadata(credential.user);
            if (!existingMetadata || existingMetadata.role !== account.role
                || (account.role !== "admin" && existingMetadata.ownerAdminId !== account.ownerAdminId)) {
                throw new Error("That login is already assigned to another profile or admin workspace.");
            }
        }
        await credential.user.updateProfile({ displayName: getFirebaseAccountMetadata(account) });
        return credential.user.uid;
    } catch (error) {
        if (createdAccount && credential?.user) await credential.user.delete().catch(() => {});
        throw error;
    } finally {
        await provisioningAuth.signOut();
    }
}

function readFirebaseAccountMetadata(user) {
    try {
        const metadata = JSON.parse(user?.displayName || "null");
        if (["admin", "manager", "worker"].includes(metadata?.role)) return metadata;
    } catch {
        return null;
    }
    return null;
}

function togglePasswordVisibility(button) {
    const input = button.parentElement.querySelector("input");
    if (!input) return;

    const shouldShow = input.type === "password";
    input.type = shouldShow ? "text" : "password";
    button.textContent = shouldShow ? "Hide" : "Show";
    button.setAttribute("aria-label", shouldShow ? "Hide password" : "Show password");
    button.setAttribute("aria-pressed", String(shouldShow));
}

async function createFirstAdmin(event) {
    event.preventDefault();
    const data = new FormData(event.target);
    const email = String(data.get("email") || "").trim().toLowerCase();
    const phone = String(data.get("phone") || "").trim();
    const username = String(data.get("username") || "").trim();
    const password = String(data.get("password") || "");
    if (password.length < 8 || password !== data.get("confirmPassword")) {
        showAuthNotice("Use at least 8 characters and make both passwords match.");
        return;
    }
    if (authAccounts.some(account => account.email === email || account.phone === phone)) {
        showAuthNotice("That email or phone number is already registered.");
        return;
    }
    if (authAccounts.some(account => account.username?.toLowerCase() === username.toLowerCase())) {
        showAuthNotice("That username is already in use.");
        return;
    }

    try {
        const salt = createAuthSalt();
        const account = {
            id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
            role: "admin",
            email,
            phone,
            username,
            salt,
            passwordHash: await hashAuthPassword(password, salt),
            createdAt: new Date().toISOString()
        };
        account.firebaseUid = await provisionFirebaseLogin(account, password, false);
        await firebase.auth().signInWithEmailAndPassword(getFirebaseLoginEmail(username), password);
        authAccounts.push(account);
        saveAuthAccounts();
        startAuthSession(account);
    } catch (error) {
        showAuthNotice(error.message || "Could not create the admin profile.");
    }
}

async function login(event) {
    event.preventDefault();
    const data = new FormData(event.target);
    const identifier = String(data.get("identifier") || "").trim().toLowerCase();
    const selectedPanel = String(data.get("panel") || "");
    const localAccount = authAccounts.find(item =>
        item.email?.toLowerCase() === identifier || item.phone?.toLowerCase() === identifier || item.username?.toLowerCase() === identifier
    );
    const password = String(data.get("password") || "");
    if (isInactiveStaffAccount(localAccount)) {
        showAuthNotice("This account is inactive. Contact the administrator.");
        return;
    }

    try {
        if (localAccount && localAccount.role !== "admin") {
            const passwordHash = await hashAuthPassword(password, localAccount.salt);
            if (passwordHash !== localAccount.passwordHash) {
                showAuthNotice("Account or password is incorrect.");
                return;
            }
        }

        const auth = firebase.auth();
        let credential;
        try {
            credential = await auth.signInWithEmailAndPassword(
                getFirebaseLoginEmail(localAccount?.username || identifier),
                password
            );
        } catch (error) {
            if (!localAccount || error.code !== "auth/user-not-found") throw error;
            await provisionFirebaseLogin(localAccount, password);
            credential = await auth.signInWithEmailAndPassword(
                getFirebaseLoginEmail(localAccount.username || identifier),
                password
            );
        }

        let metadata = readFirebaseAccountMetadata(credential.user);
        if (localAccount) {
            const localMetadata = {
                role: localAccount.role,
                workerName: localAccount.workerName || "",
                username: localAccount.username || localAccount.email || identifier,
                ownerAdminId: localAccount.ownerAdminId || ""
            };
            if (JSON.stringify(metadata) !== JSON.stringify(localMetadata)) {
                await credential.user.updateProfile({ displayName: JSON.stringify(localMetadata) })
                    .catch(error => console.warn("Could not update Firebase account metadata.", error));
            }
            metadata = localMetadata;
        }
        if (!metadata) {
            await auth.signOut();
            showAuthNotice("Account or password is incorrect.");
            return;
        }

        const accountPanel = metadata.role === "worker" ? "assistant" : metadata.role;
        if (selectedPanel !== accountPanel) {
            await auth.signOut();
            showAuthNotice("The selected panel does not match this account. Choose the correct panel.");
            return;
        }

        const ownerAdminId = metadata.role === "admin"
            ? credential.user.uid
            : metadata.ownerAdminId || localAccount?.ownerAdminId || "";
        if (metadata.role !== "admin" && !ownerAdminId) {
            await auth.signOut();
            showAuthNotice("This staff account is not assigned to an admin workspace. Ask the administrator to create a new staff login.");
            return;
        }

        const account = localAccount || {
            id: credential.user.uid,
            role: metadata.role,
            workerName: metadata.workerName || "",
            ownerAdminId,
            username: metadata.username || identifier,
            email: credential.user.email,
            createdAt: new Date().toISOString()
        };
        account.role = metadata.role;
        account.workerName = metadata.workerName || "";
        account.ownerAdminId = ownerAdminId;
        account.username = metadata.username || account.username || identifier;
        account.firebaseUid = credential.user.uid;
        if (account.workerName) {
            if (!workers.includes(account.workerName)) workers.push(account.workerName);
            workerProfiles[account.workerName] = account.role === "manager" ? "manager" : "assistant";
            if (workerStatus[account.workerName] === undefined) workerStatus[account.workerName] = true;
            if (!workerIds[account.workerName]) workerIds[account.workerName] = `W-${String(workers.indexOf(account.workerName) + 1).padStart(3, "0")}`;
        }
        if (!localAccount) authAccounts.push(account);
        saveAuthAccounts();
        startAuthSession(account);
    } catch (error) {
        if (["auth/operation-not-allowed", "auth/configuration-not-found"].includes(error.code)) {
            showAuthNotice("Firebase Authentication is not set up yet. Ask the administrator to enable Email/Password sign-in in the Firebase Console.");
        } else if (["auth/user-not-found", "auth/wrong-password", "auth/invalid-credential", "auth/invalid-email"].includes(error.code)) {
            showAuthNotice("Account or password is incorrect. Existing profiles may need to be activated once by the administrator.");
        } else {
            showAuthNotice(error.message || "Could not sign in.");
        }
    }
}

function startAuthSession(account) {
    const expiresAt = Date.now() + 60 * 24 * 60 * 60 * 1000;
    if (account.role !== "admin") recentlySetStaffPasswords.clear();
    localStorage.setItem("authSession", JSON.stringify({ accountId: account.id, expiresAt }));
    const workspaceId = getWorkspaceIdForAccount(account);
    if (!workspaceId) {
        localStorage.removeItem("authSession");
        renderAuthPage("This account is not assigned to an admin workspace.");
        return;
    }
    if (activeWorkspaceId !== workspaceId) {
        activeWorkspaceId = workspaceId;
        location.reload();
        return;
    }
    sessionUser = account.username || account.email;
    currentUserRole = account.role;
    if (account.workerName) {
        currentWorkerName = account.workerName;
        selectedStaff = account.workerName;
    }
    document.body.classList.remove("auth-locked");
    updateHeaderIdentity();
    showPage(currentUserRole === "worker" ? "worker" : "admin");
}

function restoreAuthSession() {
    let savedSession;
    try {
        savedSession = JSON.parse(localStorage.getItem("authSession") || "null");
    } catch {
        savedSession = null;
    }
    const account = authAccounts.find(item => item.id === savedSession?.accountId);
    if (!account || !getWorkspaceIdForAccount(account) || savedSession.expiresAt <= Date.now() || isInactiveStaffAccount(account)) {
        localStorage.removeItem("authSession");
        currentUserRole = "guest";
        renderAuthPage();
        return;
    }
    currentUserRole = account.role;
    sessionUser = account.username || account.email;
    if (account.workerName) {
        currentWorkerName = account.workerName;
        selectedStaff = account.workerName;
    }
    document.body.classList.remove("auth-locked");
    updateHeaderIdentity();
    showPage(currentUserRole === "worker" ? "worker" : "admin");
}

function logout() {
    recentlySetStaffPasswords.clear();
    stopSharedListeners();
    firebase.auth().signOut().catch(error => console.warn("Could not sign out of Firebase.", error));
    localStorage.removeItem("authSession");
    localStorage.removeItem("sessionUser");
    localStorage.removeItem("currentUserRole");
    currentUserRole = "guest";
    sessionUser = "";
    renderAuthPage("You have been logged out.");
}

async function saveAdminCredentials(event) {
    event.preventDefault();
    if (currentUserRole !== "admin") return;

    const account = getCurrentAdminAccount();
    const user = firebase.auth().currentUser;
    const data = new FormData(event.target);
    const currentPassword = String(data.get("currentPassword") || "");
    const username = String(data.get("username") || "").trim().toLowerCase();
    const password = String(data.get("password") || "");
    const confirmPassword = String(data.get("confirmPassword") || "");
    const notice = document.getElementById("adminCredentialsNotice");
    const showError = message => {
        notice.textContent = message;
        notice.classList.add("visible");
    };

    if (!account || !user || account.firebaseUid !== user.uid) {
        showError("Could not verify the signed-in admin account.");
        return;
    }
    if (!username || /\s/.test(username)) {
        showError("Use a username without spaces.");
        return;
    }
    if (authAccounts.some(item => item.id !== account.id && item.username?.toLowerCase() === username)) {
        showError("That username is already in use.");
        return;
    }
    if (password && (password.length < 8 || password !== confirmPassword)) {
        showError("Use at least 8 characters and make both new passwords match.");
        return;
    }
    if (username === account.username && !password) {
        showError("Enter a new username or password.");
        return;
    }

    let usernameUpdated = false;
    try {
        const credential = firebase.auth.EmailAuthProvider.credential(user.email, currentPassword);
        await user.reauthenticateWithCredential(credential);

        if (username !== account.username) {
            await user.updateEmail(getFirebaseLoginEmail(username));
            usernameUpdated = true;
            account.username = username;
            saveAuthAccounts();
            await user.updateProfile({ displayName: getFirebaseAccountMetadata(account) });
            sessionUser = username;
            localStorage.setItem("sessionUser", sessionUser);
            updateHeaderIdentity();
        }

        if (password) {
            await user.updatePassword(password);
            account.salt = createAuthSalt();
            account.passwordHash = await hashAuthPassword(password, account.salt);
            saveAuthAccounts();
        }

        recordActivity("Admin account security updated", {
            worker: username,
            location: selectedLocation,
            details: "Admin username or password changed"
        });
        closeModal();
        adminPage();
        alert("Admin account updated.");
    } catch (error) {
        if (usernameUpdated) {
            account.username = username;
            saveAuthAccounts();
            await user.updateProfile({ displayName: getFirebaseAccountMetadata(account) }).catch(() => {});
            showError(`Username updated, but another change failed: ${error.message || "Try again."}`);
        } else {
            showError(error.message || "Could not update the admin account.");
        }
    }
}

async function switchPanelWithCredentials(event) {
    event.preventDefault();
    if (currentUserRole !== "admin") return;

    const data = new FormData(event.target);
    const identifier = String(data.get("identifier") || "").trim().toLowerCase();
    const account = authAccounts.find(item =>
        isAccountInCurrentWorkspace(item) &&

    );

    };

    }

        showError("This account is inactive. Contact the administrator.");
        return;
    }

    try {
        const passwordHash = await hashAuthPassword(String(data.get("password") || ""), account.salt);
        if (passwordHash !== account.passwordHash) {

        }

        account.firebaseUid = await provisionFirebaseLogin(account, String(data.get("password") || ""));

        );

function beginPasswordRecovery(event) {
    event.preventDefault();
    const identifier = String(new FormData(event.target).get("identifier") || "").trim().toLowerCase();
    const account = authAccounts.find(item =>
        item.email?.toLowerCase() === identifier ||
        item.username?.toLowerCase() === identifier ||
        item.phone?.replace(/[\s()-]/g, "") === identifier.replace(/[\s()-]/g, "")
    );
    if (!account) {
        showAuthNotice("No account matches that email, phone, or username.");
        return;
    }
    const code = String(crypto.getRandomValues(new Uint32Array(1))[0] % 1000000).padStart(6, "0");
    pendingRecovery = { accountId: account.id, code, expiresAt: Date.now() + 10 * 60 * 1000 };
    document.getElementById("recoveryCodeArea").style.display = "block";
    document.getElementById("recoveryCodeNotice").textContent = `Local demo code: ${code}. It expires in 10 minutes and was not sent by email or SMS.`;
    showAuthNotice("");
}

async function completePasswordRecovery(event) {
    event.preventDefault();
    const data = new FormData(event.target);
    if (!pendingRecovery || pendingRecovery.expiresAt <= Date.now() || String(data.get("code") || "").trim() !== pendingRecovery.code) {
        pendingRecovery = null;
        showAuthNotice("That demo code is invalid or expired. Generate a new one.");
        return;
    }
    const password = String(data.get("password") || "");
    if (password.length < 8 || password !== data.get("confirmPassword")) {
        showAuthNotice("Use at least 8 characters and make both passwords match.");
        return;
    }
    const account = authAccounts.find(item => item.id === pendingRecovery.accountId);
    if (!account) {
        showAuthNotice("Account was not found.");
        return;
    }
    try {
        account.salt = createAuthSalt();
        account.passwordHash = await hashAuthPassword(password, account.salt);
        saveAuthAccounts();
        pendingRecovery = null;
        renderAuthPage("Password updated. Sign in with your new password.");
    } catch (error) {
        showAuthNotice(error.message || "Could not update the password.");
    }
}

function getWorkerProfile(workerName) {
    const profile = workerProfiles[workerName];
    return profile === "manager" ? "Manager" : "Assistant";
}

function updateHeaderIdentity() {
    const roleElement = document.getElementById("headerRole");
    const profileElement = document.getElementById("headerProfile");
    if (!roleElement || !profileElement) return;

    const workerName = currentWorkerName || "Assistant";
    const workerProfile = getWorkerProfile(workerName);
    roleElement.textContent = currentUserRole === "admin"
        ? "Admin"
        : currentUserRole === "manager" ? "Manager" : "Assistant";
    profileElement.textContent = currentUserRole === "admin"
        ? "Administrator"
        : currentUserRole === "manager"
            ? `${workerName} Manager profile`
            : workerName.toLowerCase() === workerProfile.toLowerCase()
                ? workerName
                : `${workerName} (${workerProfile})`;
}

function money(number) {

        Number(number || 0)

function getSold(productId) {

    return sales
        .filter(
            sale =>
                sale.productId == productId &&
                sale.status === "paid"
        )
        .reduce(
            (total, sale) =>
                total + sale.quantity,
            0
        );
}

function getStock(product) {
    const warehouseQuantity = getWarehouseStock(product);
    return warehouseQuantity + workers.reduce((total, worker) => total + getWorkerStock(worker, product), 0);
}

function getWarehouseStock(product) {
    return Math.max(0, Number(warehouseStock[product.id] || 0));
}

function getWorkerStock(workerName, product) {
    return Math.max(0, Number(workerInventory[workerName]?.[product.id] || 0));
}

function getAvailableStock(product) {
    const workerName = currentUserRole === "worker" ? currentWorkerName : selectedStaff;
    return getWorkerStock(workerName, product);
}

function recordWarehouseMovement(type, product, quantity, details = {}) {
    warehouseMovements.unshift({
        id: Date.now(),
        type,
        productId: product.id,
        productName: product.name,
        productNo: product.productNo || product.sku || "N/A",
        sku: product.sku,
        category: product.category,
        color: product.color || "Unknown",
        quantity,
        receivedQuantity: Number(details.receivedQuantity ?? quantity),
        damagedQuantity: Number(details.damagedQuantity || 0),
        unitCost: details.unitCost === undefined ? null : Number(details.unitCost),
        totalCost: details.totalCost === undefined ? null : Number(details.totalCost),
        worker: details.worker || "",
        location: details.location || "Warehouse",
        note: details.note || "",
        time: details.receivedDate
            ? new Date(`${details.receivedDate}T12:00:00`).toISOString()
            : new Date().toISOString()
    });
}

function getCashCollectionTotals(location) {
    return sales.reduce((totals, sale) => {
        if (sale.payment !== "cash" || (location !== undefined && sale.location !== location)) {
            return totals;
        }

        const amount = Number(sale.total || 0);
        const collectedAmount = sale.cashCollected
            ? amount
            : Math.min(amount, Math.max(0, Number(sale.cashCollectedAmount || 0)));
        totals.total += amount;
        totals.collected += collectedAmount;
        totals.uncollected += amount - collectedAmount;
        return totals;
    }, { total: 0, collected: 0, uncollected: 0 });
}

function getCashSaleStatus(sale) {
    if (sale.cashCollected) return "Collected";
    const collectedAmount = Number(sale.cashCollectedAmount || 0);
    if (collectedAmount > 0) return `Partially collected (${money(collectedAmount)})`;
    return "Uncollected";
}

function getPayrollCycle(frequency, date = new Date()) {
    const year = date.getFullYear();
    if (frequency === "yearly") {
        return {
            key: String(year),
            start: new Date(year, 0, 1),
            end: new Date(year + 1, 0, 1),
            label: String(year)
        };
    }

    const month = date.getMonth();
    return {
        key: `${year}-${String(month + 1).padStart(2, "0")}`,
        start: new Date(year, month, 1),
        end: new Date(year, month + 1, 1),
        label: date.toLocaleString("en", { month: "long", year: "numeric" })
    };
}

function getWorkerCycleSalesTotal(workerName, record, cycle, salesStart) {
    return sales
        .filter(sale => {
            const saleDate = new Date(sale.time);
            return (sale.staff || "Assistant") === workerName &&
                (!record || sale.location === record.location) &&
                sale.status === "paid" &&
                saleDate >= salesStart && saleDate < cycle.end;
        })
        .reduce((sum, sale) => sum + Number(sale.total || 0), 0);
}

function getIncentiveProgress(incentive, workerName) {
    const record = payrollRecords[workerName];
    const cycle = getPayrollCycle(record?.frequency || "monthly");
    const payment = record && payrollHistory.find(item => item.worker === workerName && item.cycle === cycle.key);
    const salesStart = payment && new Date(payment.paidAt) > cycle.start
        ? new Date(payment.paidAt)
        : cycle.start;
    const salesTotal = getWorkerCycleSalesTotal(workerName, record, cycle, salesStart);
    const targetSales = Number(incentive.targetSales || 0);

    return {
        salesTotal,
        targetSales,
        remaining: Math.max(0, targetSales - salesTotal),
        progress: targetSales > 0 ? Math.min(100, salesTotal / targetSales * 100) : 0,
        achieved: targetSales > 0 && salesTotal >= targetSales,
        cycle: cycle.label
    };
}

function getPayrollSummary(workerName) {
    const record = payrollRecords[workerName];
    if (!record) return null;

    const cycle = getPayrollCycle(record.frequency);
    const payment = payrollHistory.find(item => item.worker === workerName && item.cycle === cycle.key);
    const paid = Boolean(payment);
    const salesStart = payment && new Date(payment.paidAt) > cycle.start
        ? new Date(payment.paidAt)
        : cycle.start;
    const salesTotal = getWorkerCycleSalesTotal(workerName, record, cycle, salesStart);
    const earnedIncentives = incentiveList.filter(item =>
        Number(item.targetSales || 0) > 0 &&
        (item.workerName === "all" || !item.workerName || item.workerName === workerName) &&
        salesTotal >= Number(item.targetSales)
    );
    const incentiveTotal = earnedIncentives.reduce((sum, item) => sum + Number(item.amount || 0), 0);

    return {
        record,
        cycle,
        salesTotal,
        earnedIncentives: paid ? [] : earnedIncentives,
        paid,
        salaryDue: paid ? 0 : Number(record.salaryAmount || 0),
        incentiveDue: paid ? 0 : incentiveTotal,
        totalDue: paid ? 0 : Number(record.salaryAmount || 0) + incentiveTotal
    };
}

function loadPayrollDetails(workerName) {
    const record = payrollRecords[workerName] || {};
    const fieldValues = {
        payrollLocation: record.location || locations[0] || "",
        payrollAmount: record.salaryAmount ?? "",
        payrollFrequency: record.frequency || "monthly",
        payrollAccountHolder: record.accountHolder || "",
        payrollBankName: record.bankName || "",
        payrollAccountNumber: record.accountNumber || "",
        payrollIfsc: record.ifscCode || ""
    };

    Object.entries(fieldValues).forEach(([id, value]) => {
        const field = document.getElementById(id);
        if (field) field.value = value;
    });
}

function savePayroll() {
    if (!hasAdminAccess()) return;

    const worker = document.getElementById("payrollWorker")?.value;
    const location = document.getElementById("payrollLocation")?.value;
    const salaryInput = document.getElementById("payrollAmount")?.value;
    const salaryAmount = Number(salaryInput);
    const frequency = document.getElementById("payrollFrequency")?.value;
    const accountHolder = document.getElementById("payrollAccountHolder")?.value.trim() || "";
    const bankName = document.getElementById("payrollBankName")?.value.trim() || "";
    const accountNumber = document.getElementById("payrollAccountNumber")?.value.trim() || "";
    const ifscCode = document.getElementById("payrollIfsc")?.value.trim().toUpperCase() || "";
    if (!worker || !location || salaryInput === "" || !Number.isFinite(salaryAmount) || salaryAmount <= 0) {
        alert("Choose a worker and location, and enter a valid salary amount.");
        return;
    }

    payrollRecords[worker] = {
        worker,
        location,
        salaryAmount,
        frequency,
        accountHolder,
        bankName,
        accountNumber,
        ifscCode
    };
    saveData();
    recordActivity("Salary details saved", {
        worker,
        location,
        details: `${money(salaryAmount)} ${frequency} salary`
    });
    adminPage();
}

function markPayrollPaid(workerName) {
    if (!hasAdminAccess()) return;
    const summary = getPayrollSummary(workerName);
    if (!summary || summary.paid || summary.totalDue <= 0) return;

    payrollHistory.unshift({
        id: Date.now(),
        worker: workerName,
        location: summary.record.location,
        frequency: summary.record.frequency,
        cycle: summary.cycle.key,
        salaryAmount: summary.salaryDue,
        incentiveAmount: summary.incentiveDue,
        totalAmount: summary.totalDue,
        accountHolder: summary.record.accountHolder || "",
        bankName: summary.record.bankName || "",
        accountNumber: summary.record.accountNumber || "",
        ifscCode: summary.record.ifscCode || "",
        incentives: summary.earnedIncentives.map(item => ({ title: item.title, amount: Number(item.amount || 0) })),
        paidAt: new Date().toISOString()
    });

    saveData();
    recordActivity("Salary and incentives paid", {
        worker: workerName,
        location: summary.record.location,
        details: `${money(summary.totalDue)} paid for ${summary.cycle.label}`
    });
    adminPage();
}

function receiveWarehouseStock(event) {
    event.preventDefault();
    if (!hasAdminAccess()) return;

    const data = new FormData(event.target);
    const productName = String(data.get("productName") || "").trim().toUpperCase();
    const received = Number(data.get("quantity"));
    const rawPrice = String(data.get("price") || "").trim();
    const price = rawPrice ? Number(rawPrice) : 0;
    const rawUnitCost = String(data.get("unitCost") || "").trim();
    const unitCost = rawUnitCost ? Number(rawUnitCost) : null;
    const damaged = Number(data.get("damaged"));
    const receivedDate = String(data.get("receivedDate") || "").trim();

    if (!productName || !receivedDate || !Number.isInteger(received) || received < 1 || !Number.isFinite(price) || price < 0 || (unitCost !== null && (!Number.isFinite(unitCost) || unitCost < 0)) || !Number.isInteger(damaged) || damaged < 0 || damaged > received) {
        alert("Enter a product name, a valid quantity, no more damaged units than received, and a received date.");
        return;
    }

    const working = received - damaged;
    let product = products.find(item => String(item.name || "").trim().toLowerCase() === productName.toLowerCase());

    if (product) {
        product.received = Number(product.received || 0) + received;
        product.working = Number(product.working || 0) + working;
        product.damaged = Number(product.damaged || 0) + damaged;
        product.lastReceivedDate = receivedDate;
        warehouseStock[product.id] = getWarehouseStock(product) + working;
    } else {
        const id = Date.now();
        const sku = `MAN-${id}`;
        product = {
            id,
            name: productName,
            category: "GENERAL",
            sku,
            productNo: sku,
            color: "UNKNOWN",
            price,
            received,
            working,
            damaged,
            lastReceivedDate: receivedDate
        };
        products.push(product);
        warehouseStock[id] = working;
    }

    recordWarehouseMovement("received", product, working, {
        location: "Warehouse",
        receivedQuantity: received,
        damagedQuantity: damaged,
        unitCost,
        totalCost: unitCost === null ? null : unitCost * received,
        receivedDate,
        note: `${received} received; ${damaged} damaged; ${receivedDate}`
    });
    saveData();
    recordActivity("Inventory received", {
        worker: selectedStaff,
        location: selectedLocation,
        details: `${product.name} • ${received} units • damaged: ${damaged} • date: ${receivedDate}`
    });

    currentAdminFocus = "warehouse";
    adminPage();
    alert("Stock received successfully.");
}

function dispatchWarehouseStock(event) {
    event.preventDefault();
    if (!hasAdminAccess()) return;

    const data = new FormData(event.target);
    const worker = String(data.get("worker") || "").trim();
    const productName = String(data.get("productName") || "").trim();
    const quantity = Number(data.get("quantity"));
    const location = String(data.get("location") || "").trim();
    const product = products.find(item => String(item.name || "").trim().toLowerCase() === productName.toLowerCase());

    if (!workers.includes(worker) || workerProfiles[worker] === "manager") {
        alert("Select a valid assistant.");
        return;
    }

    if (!product) {
        alert("Product not found. Add it to warehouse stock before dispatching.");
        return;
    }

    if (!Number.isInteger(quantity) || quantity < 1) {
        alert("Enter a valid whole-number quantity to dispatch.");
        return;
    }

    if (!location) {
        alert("Enter a destination.");
        return;
    }

    const warehouseQuantity = getWarehouseStock(product);
    if (quantity > warehouseQuantity) {
        alert(`Not enough warehouse stock. Available: ${warehouseQuantity}.`);
        return;
    }

    if (!locations.some(savedLocation => savedLocation.toLowerCase() === location.toLowerCase())) {
        locations.push(location);
    }

    warehouseStock[product.id] = warehouseQuantity - quantity;
    workerInventory[worker] ||= {};
    workerInventory[worker][product.id] = getWorkerStock(worker, product) + quantity;
    recordWarehouseMovement("dispatched", product, quantity, {
        worker,
        location,
        note: `Manually dispatched to ${worker}`
    });
    saveData();
    recordActivity("Inventory dispatched", {
        worker,
        location,
        details: `${product.name} • ${quantity} sent to ${worker}`
    });

    currentAdminFocus = "warehouse";
    adminPage();
    alert("Stock dispatched successfully.");
}

function receiveInventory(event) {

    event.preventDefault();

    const data =
        new FormData(event.target);

    const productId = Number(data.get("productId"));
    const product = products.find(item => item.id == productId);

    if (!product) {
        alert("Please select a valid assigned product.");
        return;
    }

    const received =
        Number(data.get("received"));

    const working =
        Number(data.get("working"));

    const damaged =
        Number(data.get("damaged"));

    const rawUnitCost = String(data.get("unitCost") || "").trim();
    const unitCost = rawUnitCost ? Number(rawUnitCost) : null;

    const receivedDate = String(data.get("receivedDate") || "").trim();

    if (!receivedDate) {
        alert("Receiving date is required.");
        return;
    }

    if (!Number.isInteger(received) || received <= 0 || !Number.isInteger(working) || working < 0 || !Number.isInteger(damaged) || damaged < 0 || working + damaged !== received || (unitCost !== null && (!Number.isFinite(unitCost) || unitCost < 0))) {

        alert(
            "Enter whole-number quantities greater than zero. Working + damaged quantity must equal received quantity."
        );

        return;
    }

    product.received += received;
    product.working += working;
    product.damaged += damaged;
    product.lastReceivedDate = receivedDate;
    warehouseStock[product.id] = getWarehouseStock(product) + working;
    recordWarehouseMovement("received", product, working, {
        location: "Warehouse",
        receivedQuantity: received,
        damagedQuantity: damaged,
        unitCost,
        totalCost: unitCost === null ? null : unitCost * received,
        receivedDate,
        note: `${received} received; ${damaged} damaged; ${receivedDate}`
    });

    saveData();

    recordActivity("Inventory received", {
        worker: selectedStaff,
        location: selectedLocation,
        details: `${product.name} • ${received} units • damaged: ${damaged} • date: ${receivedDate}`
    });

    closeModal();

    currentAdminFocus = "warehouse";
    adminPage();

    alert(
        "Inventory received successfully."
    );
}

function buildUpiQrUrl(amount, note = "Sale Payment") {
    const url = `upi://pay?pa=${encodeURIComponent(upiPaymentId)}&pn=${encodeURIComponent(upiPayeeName)}&am=${Number(amount).toFixed(2)}&cu=INR&tn=${encodeURIComponent(note)}`;
    return `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(url)}`;
}

function updateUpiTimerDisplay() {
    const timerElement = document.getElementById("upiTimerText");
    const payButton = document.getElementById("upiConfirmButton");

    if (!timerElement || !payButton) return;

    const remainingMs = Math.max(0, upiPaymentDeadline - Date.now());
    const totalSeconds = Math.ceil(remainingMs / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    timerElement.textContent = remainingMs > 0
        ? `Payment QR valid for ${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`
        : "Payment QR expired. Please generate a new QR.";

    const isEnabled = remainingMs > 0;
    payButton.disabled = !isEnabled;
    payButton.style.opacity = isEnabled ? "1" : "0.55";
    payButton.style.cursor = isEnabled ? "pointer" : "not-allowed";

    if (remainingMs <= 0) {
        clearInterval(upiTimerId);
        upiTimerId = null;
    }
}

function startPayment() {

    const product =
        products.find(
            p =>
                p.id == selectedProduct
        );

    const quantity =
        Number(selectedQuantity);

    if (
        !product ||
        quantity < 1 ||
        quantity > getAvailableStock(product)
    ) {

        alert(
            "Please check product and quantity."
        );

        return;
    }

    const total =
        quantity * product.price;

    if (
        paymentMethod === "cash"
    ) {

        completeSale("cash");

        return;
    }

    if (!upiPaymentId || !upiPayeeName) {
        alert("Set the receiving UPI ID and payee name in Software before generating a payment QR.");
        return;
    }

    upiPaymentDeadline = Date.now() + upiQrDurationMinutes * 60 * 1000;
    renderUpiPaymentQr();
}

function renderUpiPaymentQr() {
    const product = products.find(item => item.id == selectedProduct);
    if (!product) return;

    const total = Number(selectedQuantity) * product.price;
    document.getElementById("modal").classList.remove("hidden");
    document.getElementById("modal").innerHTML = `
        <div class="modal-box center">
            <p style="font-size:18px;font-weight:700;">${escapeHtml(upiPayeeName)}</p>
            <img
                src="${buildUpiQrUrl(total)}"
                alt="UPI payment QR code"
                style="width:240px;height:240px;display:block;margin:20px auto;border:10px solid white;box-shadow:0 0 0 1px #ddd;border-radius:12px;background:white;"
            >
            <p id="upiTimerText" style="color:#777; margin-top:8px;">
                Payment QR valid for ${String(upiQrDurationMinutes).padStart(2, "0")}:00
            </p>
            <button
                id="upiConfirmButton"
                class="primary-button"
                onclick="completeSale('upi')"
                disabled
                style="opacity:0.55;cursor:not-allowed;">
                Payment received
            </button>
            <br><br>
            <button class="secondary-button" onclick="closeModal()">Cancel</button>
        </div>
    `;
    updateUpiTimerDisplay();
    clearInterval(upiTimerId);
    upiTimerId = setInterval(updateUpiTimerDisplay, 1000);
}

function completeSale(method) {

    if (method === "upi" && (!upiPaymentDeadline || Date.now() >= upiPaymentDeadline)) {
        alert("This payment QR has expired. Generate a new QR before confirming payment.");
        return;
    }

    const product =
        products.find(
            p =>
                p.id == selectedProduct
        );

    const quantity =
        Number(selectedQuantity);

    if (
        !product ||
        quantity > getAvailableStock(product)
    ) {

        alert(
            "Not enough inventory."
        );

        return;
    }

    const total =
        quantity * product.price;

    const saleWorker = currentUserRole === "worker" ? currentWorkerName : selectedStaff;
    const availableWorkerStock = getWorkerStock(saleWorker, product);
    if (quantity > availableWorkerStock) {
        alert("Not enough stock assigned to this worker. Request stock from the warehouse manager.");
        return;
    }

    workerInventory[saleWorker] ||= {};
    workerInventory[saleWorker][product.id] = availableWorkerStock - quantity;

    sales.unshift({

        id: Date.now(),

        productId:
            product.id,

        productName:
            product.name,

        productNo:
            product.productNo || product.sku || "N/A",

        productColor:
            product.color || "Unknown",

        quantity:
            quantity,

        total:
            total,

        payment:
            method,

        status:
            "paid",

        cashCollected:
            false,

        staff:
            saleWorker,

        location:
            selectedLocation,

        time:
            new Date().toISOString()

    });

    recordActivity("Sale completed", {
        worker: saleWorker,
        location: selectedLocation,
        details: `${product.name} × ${quantity} • ${money(total)}`
    });

    saveData();

    selectedProduct = "";
    selectedQuantity = 1;
    selectedLocation = locations[0] || "Main Store";
    selectedStaff = currentUserRole === "worker" ? currentWorkerName : workers[0] || "Assistant";
    paymentMethod = "upi";

    closeModal();

    if (upiTimerId) {
        clearInterval(upiTimerId);
        upiTimerId = null;
    }
    upiPaymentDeadline = 0;

    showPage("sales");

    alert(
        "Sale completed. Inventory automatically updated."
    );
}
