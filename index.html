function submitInventoryRequest(event) {
    event.preventDefault();
    const data = new FormData(event.target);
    const productId = Number(data.get("productId"));
    const quantity = Number(data.get("quantity"));
    const requestDate = String(data.get("requestDate") || "").trim();
    const product = products.find(item => item.id == productId);

    if (!product) {
        alert("Please select a valid product.");
        return;
    }

    if (!Number.isFinite(quantity) || quantity < 1) {
        alert("Request quantity must be greater than 0.");
        return;
    }

    if (!requestDate) {
        alert("Request date is required.");
        return;
    }

    inventoryRequests.unshift({
        id: Date.now(),
        productId: product.id,
        productName: product.name,
        productNo: product.productNo || product.sku || "N/A",
        color: product.color || "Unknown",
        quantity,
        requestedBy: currentWorkerName,
        location: selectedLocation,
        status: "pending",
        requestDate,
        createdAt: new Date().toISOString()
    });

    saveData();
    closeModal();
    showPage("worker");
    recordActivity("Inventory request sent", {
        worker: currentWorkerName,
        location: selectedLocation,
        details: `${product.name} • ${quantity} requested • ${product.color || "Unknown"} • ${product.productNo || product.sku}`
    });
    alert("Your inventory request was sent to the admin.");
}

function approveInventoryRequest(requestId) {
    const request = inventoryRequests.find(item => item.id == requestId);
    if (!request) return;

    const product = products.find(item => item.id == request.productId);
    const warehouseQuantity = product ? getWarehouseStock(product) : 0;
    if (!product || request.quantity > warehouseQuantity) {
        alert(`Not enough warehouse stock. Available: ${warehouseQuantity}.`);
        return;
    }

    warehouseStock[product.id] -= request.quantity;
    workerInventory[request.requestedBy] ||= {};
    workerInventory[request.requestedBy][product.id] = getWorkerStock(request.requestedBy, product) + request.quantity;
    recordWarehouseMovement("dispatched", product, request.quantity, {
        worker: request.requestedBy,
        location: request.location || selectedLocation,
        note: `Request approved on ${request.requestDate}`
    });

    request.status = "approved";
    request.approvedBy = selectedStaff;
    request.fulfilledAt = new Date().toISOString();
    saveData();
    adminPage();
    recordActivity("Inventory request approved", {
        worker: request.requestedBy,
        location: selectedLocation,
        details: `${request.productName} • ${request.quantity} dispatched to ${request.requestedBy} • ${request.color || "Unknown"}`
    });
    alert("Inventory request approved and stock added.");
}

function formatActivityDetails(details) {
    if (typeof details === "string") return details;
    if (!details || typeof details !== "object") return "";

    return Object.entries(details).map(([key, value]) => {
        if (key === "details") return formatActivityDetails(value);
        if (value && typeof value === "object") return formatActivityDetails(value);
        return value ? `${key}: ${value}` : "";
    }).filter(Boolean).join(" · ");
}

function getHistoryRows() {
    const saleRows = sales.map(sale => ({
        id: `sale-${sale.id}`,
        type: "Sale",
        item: sale.productName || "Item",
        quantity: Number(sale.quantity || 0),
        amount: Number(sale.total || 0),
        person: sale.staff || "Assistant",
        location: sale.location || "Main Store",
        note: sale.payment ? String(sale.payment).toUpperCase() : "",
        time: sale.time
    }));
    const purchaseRows = warehouseMovements
        .filter(movement => movement.type === "received")
        .map(movement => ({
            id: `purchase-${movement.id}`,
            type: "Purchase",
            item: movement.productName || "Item",
            quantity: Number(movement.receivedQuantity ?? movement.quantity ?? 0),
            amount: movement.totalCost == null || !Number.isFinite(Number(movement.totalCost)) ? null : Number(movement.totalCost),
            person: movement.worker || "Warehouse",
            location: movement.location || "Warehouse",
            note: movement.note || "Stock received",
            time: movement.time
        }));
    const activityRows = activityLog
        .filter(activity => !["Sale completed", "Inventory received"].includes(activity.action))
        .map(activity => ({
            id: `activity-${activity.id}`,
            type: activity.action || "Activity",
            item: formatActivityDetails(activity.details) || "Business activity",
            quantity: null,
            amount: null,
            person: activity.worker || "System",
            location: activity.location || "Unknown",
            note: "",
            time: activity.time
        }));
    const otherMovements = warehouseMovements
        .filter(movement => movement.type !== "received")
        .map(movement => ({
            id: `movement-${movement.id}`,
            type: movement.type === "dispatched" ? "Stock dispatched" : "Stock movement",
            item: movement.productName || "Item",
            quantity: Number(movement.quantity || 0),
            amount: null,
            person: movement.worker || "Warehouse",
            location: movement.location || "Warehouse",
            note: movement.note || "",
            time: movement.time
        }));

    const views = {
        all: [...saleRows, ...purchaseRows, ...otherMovements, ...activityRows],
        sales: saleRows,
        purchases: purchaseRows,
        activity: [...otherMovements, ...activityRows]
    };
    const fromTime = historyFromDate ? new Date(`${historyFromDate}T00:00:00`).getTime() : -Infinity;
    const toTime = historyToDate ? new Date(`${historyToDate}T23:59:59.999`).getTime() : Infinity;

    return (views[currentHistoryView] || views.all)
        .filter(row => {
            const rowTime = new Date(row.time || 0).getTime();
            const searchable = [row.type, row.item, row.person, row.location, row.note].join(" ").toLowerCase();
            return searchable.includes(historyQuery) && rowTime >= fromTime && rowTime <= toTime;
        })
        .sort((left, right) => new Date(right.time || 0) - new Date(left.time || 0));
}

function assignLocationToWorker() {
    const worker = document.getElementById("assignLocationWorker")?.value;
    const enteredLocation = String(document.getElementById("assignLocationValue")?.value || "").trim();

    if (!worker || !enteredLocation) {
        alert("Please select a worker and enter a location.");
        return;
    }

    const existingLocation = locations.find(item => item.toLowerCase() === enteredLocation.toLowerCase());
    const location = existingLocation || enteredLocation;
    if (!existingLocation) locations.push(location);

    selectedStaff = worker;
    selectedLocation = location;
    recordActivity("Worker assigned to location", {
        worker,
        location,
        details: `${worker} assigned to ${location}`
    });
    saveData();
    adminPage();
    alert(`${worker} is assigned to ${location}.`);
}

function addIncentive() {
    if (!hasAdminAccess()) return;
    const title = document.getElementById("incentiveTitle")?.value.trim();
    const amount = Number(document.getElementById("incentiveAmount")?.value || 0);
    const targetSales = Number(document.getElementById("incentiveTargetSales")?.value || 0);
    const note = document.getElementById("incentiveNote")?.value.trim();
    const workerName = document.getElementById("incentiveWorker")?.value || "all";

    if (!title) {
        alert("Incentive title is required.");
        return;
    }

    incentiveList.unshift({
        id: Date.now(),
        title,
        amount: Number.isFinite(amount) ? Math.max(0, amount) : 0,
        targetSales: Number.isFinite(targetSales) ? Math.max(0, targetSales) : 0,
        workerName,
        note: note || "Worker reward"
    });

    saveData();
    adminPage();
    document.getElementById("incentiveTitle").value = "";
    document.getElementById("incentiveAmount").value = "0";
    document.getElementById("incentiveTargetSales").value = "0";
    document.getElementById("incentiveNote").value = "";

        details: `${title} • ${money(amount)}`

function openWorkerPasswordReset(encodedAccountId) {
    if (currentUserRole !== "admin") return;

    let accountId;
    try {
        accountId = decodeURIComponent(encodedAccountId);
    } catch {
        return;
    }

    const account = authAccounts.find(item => isAccountInCurrentWorkspace(item) && item.id === accountId && ["worker", "manager"].includes(item.role));
    if (!account) return;

    const modal = document.getElementById("modal");
    modal.innerHTML = `

            <div class="section-header">

async function saveWorkerPassword(event) {
    event.preventDefault();
    if (currentUserRole !== "admin") return;

    const data = new FormData(event.target);
    const account = authAccounts.find(item => isAccountInCurrentWorkspace(item) && item.id === data.get("accountId") && ["worker", "manager"].includes(item.role));
    const password = String(data.get("password") || "");
    const confirmPassword = String(data.get("confirmPassword") || "");
    const notice = document.getElementById("workerPasswordNotice");
    const showError = message => {
        notice.textContent = message;
        notice.classList.add("visible");
    };

    if (!account) {
        showError("This staff login was not found.");
        return;
    }
    if (password.length < 8 || password !== confirmPassword) {
        showError("Use at least 8 characters and make both passwords match.");
        return;
    }

    try {
        account.firebaseUid = await provisionFirebaseLogin(account, password);
        account.salt = createAuthSalt();
        account.passwordHash = await hashAuthPassword(password, account.salt);
        saveAuthAccounts();
        recentlySetStaffPasswords.set(account.id, password);
        recordActivity("Staff password reset", {
            worker: account.workerName || account.username,
            location: selectedLocation,
            details: `Password reset for ${account.workerName || account.username}`
        });
        closeModal();
        adminPage();
        alert("Password updated. Share the new password with the staff member securely.");
    } catch (error) {
        showError(error.code === "auth/wrong-password" || error.code === "auth/invalid-credential"
            ? "This shared login already has a different Firebase password. This page cannot securely reset it."
            : error.message || "Could not update the password.");
    }
}

function toggleStaffPasswordVisibility(encodedAccountId, button) {
    if (currentUserRole !== "admin") return;

    const accountId = decodeURIComponent(encodedAccountId);
    if (!authAccounts.some(account => isAccountInCurrentWorkspace(account) && account.id === accountId)) return;
    const password = recentlySetStaffPasswords.get(accountId);
    const passwordElement = document.getElementById(`staff-password-${encodedAccountId}`);
    if (!password || !passwordElement) return;

    const shouldShow = passwordElement.hidden;
    passwordElement.textContent = shouldShow ? `Password: ${password}` : "";
    passwordElement.hidden = !shouldShow;
    button.textContent = shouldShow ? "Hide password" : "Show password";
    button.setAttribute("aria-pressed", String(shouldShow));
}

function deleteWorkerAccount(workerName) {
    if (!confirm(`Delete worker ${workerName}?`)) return;

    workers = workers.filter(item => item !== workerName);
    delete workerProfiles[workerName];
    delete workerStatus[workerName];
    delete workerIds[workerName];
    delete payrollRecords[workerName];

    if (currentWorkerName === workerName) {

    }

    saveData();
    adminPage();
    recordActivity("Worker deleted", {
        worker: selectedStaff,
        location: selectedLocation,
        details: `${workerName} removed from team`
    });
}

function addProduct() {
    const nameInput = document.getElementById("newProductName");
    const skuInput = document.getElementById("newProductSku");
    const categoryInput = document.getElementById("newProductCategory");
    const colorInput = document.getElementById("newProductColor");
    const noInput = document.getElementById("newProductNo");
    const quantityInput = document.getElementById("newProductQuantity");
    const priceInput = document.getElementById("newProductPrice");

    const name = (nameInput.value || "").trim().toUpperCase();
    const sku = (skuInput.value || "").trim().toUpperCase();
    const category = (categoryInput.value || "").trim().toUpperCase();
    const color = (colorInput.value || "").trim().toUpperCase();
    const productNo = (noInput.value || "").trim().toUpperCase();
    const quantity = Number(quantityInput.value || 0);
    const price = Number(priceInput.value || 0);

    if (!name || !sku || !category) {
        alert("Product name, SKU, and category are required.");
        return;
    }

    if (!Number.isFinite(quantity) || quantity < 0) {
        alert("Quantity sent must be a valid number.");
        return;
    }

    if (products.some(product => product.sku === sku)) {
        alert("This SKU already exists.");
        return;
    }

    products.push({
        id: Date.now(),
        name,
        category,
        sku,
        productNo: productNo || sku,
        color: color || "UNKNOWN",
        price: Number.isFinite(price) ? Math.max(0, price) : 0,
        received: quantity,
        working: quantity,
        damaged: 0,
        lastReceivedDate: ""
    });

    const newProduct = products[products.length - 1];
    warehouseStock[newProduct.id] = quantity;
    recordWarehouseMovement("received", newProduct, quantity, {
        location: "Warehouse",
        note: "Initial stock entry"
    });

    saveData();
    adminPage();

    nameInput.value = "";
    skuInput.value = "";
    categoryInput.value = "";
    colorInput.value = "";
    noInput.value = "";
    quantityInput.value = "0";
    priceInput.value = "0";

    recordActivity("Product assigned", {
        worker: selectedStaff,
        location: selectedLocation,
        details: `${name} • ${sku} • ${quantity} sent • ${color || "UNKNOWN"} • ${money(price)}`
    });
}

function updateProductPrice(productId, rawValue) {
    const product = products.find(item => item.id == productId);
    if (!product) return;

    const value = Number(rawValue);
    product.price = Number.isFinite(value) ? Math.max(0, value) : 0;
    saveData();
}

function saveInventoryChanges(productId) {
    const product = products.find(item => item.id == productId);
    if (!product) return;

    const name = String(document.getElementById(`inventory-name-${productId}`)?.value || "").trim();
    const sku = String(document.getElementById(`inventory-sku-${productId}`)?.value || "").trim().toUpperCase();
    const category = String(document.getElementById(`inventory-category-${productId}`)?.value || "").trim().toUpperCase();

    if (!name) {
        alert("Inventory name cannot be empty.");
        return;
    }

    const duplicateSku = products.some(
        item => item.id != productId && item.sku.toUpperCase() === sku && sku
    );

    if (duplicateSku) {
        alert("This SKU already exists for another inventory item.");
        return;
    }

    const previousName = product.name;
    product.name = name;
    product.sku = sku || product.sku;
    product.category = category || product.category;

    saveData();
    adminPage();
    recordActivity("Inventory updated", {
        worker: selectedStaff,
        location: selectedLocation,
        details: `${previousName} → ${product.name} • ${product.sku}`
    });
    alert("Inventory item updated successfully.");
}

function deleteProduct(productId) {
    const product = products.find(item => item.id == productId);
    if (!product) return;

    const confirmDelete = confirm(`Delete "${product.name}" from inventory?`);
    if (!confirmDelete) return;

    products = products.filter(item => item.id != productId);
    sales = sales.filter(sale => sale.productId != productId);
    inventoryRequests = inventoryRequests.filter(request => request.productId != productId);

    if (selectedProduct == productId) {
        selectedProduct = "";
        selectedQuantity = 1;
    }

    saveData();
    adminPage();
    recordActivity("Inventory removed", {
        worker: selectedStaff,
        location: selectedLocation,
        details: `${product.name} • ${product.sku}`
    });
    alert("Inventory item deleted.");
}

async function addWorker(event) {
    event.preventDefault();
    if (currentUserRole !== "admin") {
        alert("Only the administrator can create staff accounts.");
        return;
    }
    const data = new FormData(event.target);
    const name = String(data.get("name") || "").trim();
    const username = String(data.get("username") || "").trim().toLowerCase();
    const role = data.get("role") === "manager" ? "manager" : "worker";
    const password = String(data.get("password") || "");
    if (!name || !username || password.length < 8) {
        alert("Enter a name, username, and password with at least 8 characters.");
        return;
    }
    if (workers.includes(name) || authAccounts.some(account => account.username?.toLowerCase() === username)) {
        alert("That name or username is already in use.");
        return;
    }

    try {
        const salt = createAuthSalt();
        const account = {
            id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
            role,
            workerName: name,
            ownerAdminId: activeWorkspaceId,
            username,
            salt,
            passwordHash: await hashAuthPassword(password, salt),
            createdAt: new Date().toISOString()
        };
        account.firebaseUid = await provisionFirebaseLogin(account, password);
        await firebase.firestore().collection("staffOwners").doc(account.firebaseUid)
            .set({ ownerAdminId: activeWorkspaceId });
        await firebase.firestore()
            .collection("businessWorkspaces").doc(activeWorkspaceId)
            .collection("members").doc(account.firebaseUid)
            .set({ ownerAdminId: activeWorkspaceId, role: account.role });
        authAccounts.push(account);
        workers.push(name);
        workerProfiles[name] = role === "manager" ? "manager" : "assistant";
        workerStatus[name] = true;
        workerIds[name] = `W-${String(workers.length).padStart(3, "0")}`;
        selectedStaff = name;
        saveAuthAccounts();
        saveData();
        recordActivity("Staff login created", {
            worker: name,
            location: selectedLocation,
            details: `${name} added as ${role === "manager" ? "Manager" : "Assistant"}`
        });
        adminPage();
    } catch (error) {
        alert(error.message || "Could not create the staff login.");
    }
}

function assignWorkerProfile() {

function collectCash(returnPage = "money") {
    const location = selectedCashCollectionLocation;
    const amountInput = document.getElementById("cashCollectionAmount")?.value;
    const requestedAmount = Math.round(Number(amountInput) * 100) / 100;
    const locationTotals = getCashCollectionTotals(location);

    if (amountInput === "" || !Number.isFinite(requestedAmount) || requestedAmount <= 0) {
        alert("Enter the amount of cash received.");
        return;
    }

    if (requestedAmount > locationTotals.uncollected + 0.000001) {
        alert(`Amount exceeds the uncollected cash at ${location}.`);
        return;
    }

    const pendingSales = sales.filter(sale =>
        sale.payment === "cash" &&
        !sale.cashCollected &&
        sale.location === location &&
        Number(sale.total || 0) > Number(sale.cashCollectedAmount || 0)
    ).sort((first, second) => new Date(first.time) - new Date(second.time));

    if (!pendingSales.length) {
        alert(`No uncollected cash for ${location || "this location"}.`);
        return;
    }

    const collectedAt = new Date().toISOString();
    let amountRemaining = requestedAmount;
    for (const sale of pendingSales) {
        if (amountRemaining <= 0) break;
        const saleTotal = Number(sale.total || 0);
        const alreadyCollected = Number(sale.cashCollectedAmount || 0);
        const amountForSale = Math.min(saleTotal - alreadyCollected, amountRemaining);
        sale.cashCollectedAmount = alreadyCollected + amountForSale;
        amountRemaining -= amountForSale;

        if (sale.cashCollectedAmount >= saleTotal - 0.005) {
            sale.cashCollectedAmount = saleTotal;
            sale.cashCollected = true;
            sale.cashCollectedAt = collectedAt;
        }
    }

    recordActivity("Cash collected", {
        worker: selectedStaff,
        location,
        details: `${money(requestedAmount)} collected from ${location}`
    });

    if (returnPage === "payments") {
        paymentsPage();
    } else {
        moneyPage();
    }

    alert(`${money(requestedAmount)} cash collected from ${location}.`);
}

    if (upiTimerId) {

const THEME_KEY = "inventoryTheme";

function applyTheme(theme) {
    const isDark = theme === "dark";
    document.body.classList.toggle("theme-dark", isDark);
    document.body.classList.toggle("theme-light", !isDark);
    document.documentElement.style.colorScheme = isDark ? "dark" : "light";
    localStorage.setItem(THEME_KEY, theme);
}

function setTheme(theme) {
    applyTheme(theme);
    if (document.getElementById("modal") && !document.getElementById("modal").classList.contains("hidden")) {
        openSettings();
    }
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
    })[character]);
}

function savePaymentSettings(event) {
    event.preventDefault();
    if (currentUserRole !== "admin") return;

    const data = new FormData(event.target);
    const upiId = String(data.get("upiPaymentId") || "").trim();
    const payeeName = String(data.get("upiPayeeName") || "").trim();
    const duration = Number(data.get("upiQrDurationMinutes"));
    if (!/^[A-Za-z0-9._-]+@[A-Za-z0-9.-]+$/.test(upiId)) {
        const notice = document.getElementById("paymentSettingsNotice");
        notice.textContent = "Enter a valid UPI ID or Razorpay UPI VPA, such as name@bank.";
        notice.classList.add("visible");
        return;
    }

    if (!payeeName) {
        const notice = document.getElementById("paymentSettingsNotice");
        notice.textContent = "Enter the account or business name that should appear on the payment QR.";
        notice.classList.add("visible");
        return;
    }

    upiPaymentId = upiId;
    upiPayeeName = payeeName;
    paymentBankName = String(data.get("paymentBankName") || "").trim();
    paymentAccountHolder = String(data.get("paymentAccountHolder") || "").trim();
    paymentAccountNumber = String(data.get("paymentAccountNumber") || "").trim();
    paymentIfscCode = String(data.get("paymentIfscCode") || "").trim().toUpperCase();
    upiQrDurationMinutes = duration === 5 ? 5 : 3;

    setWorkspaceItem("upiPaymentId", upiPaymentId);
    setWorkspaceItem("upiPayeeName", upiPayeeName);
    setWorkspaceItem("paymentBankName", paymentBankName);
    setWorkspaceItem("paymentAccountHolder", paymentAccountHolder);
    setWorkspaceItem("paymentAccountNumber", paymentAccountNumber);
    setWorkspaceItem("paymentIfscCode", paymentIfscCode);
    setWorkspaceItem("upiQrDurationMinutes", String(upiQrDurationMinutes));
    scheduleSharedSave();

    softwarePage();
    const notice = document.getElementById("paymentSettingsNotice");
    if (notice) {
        notice.textContent = "Payment details saved.";
        notice.classList.add("visible");
    }
}

function resetApp() {

    const answer =
        confirm(
            "Reset all demo data?"
        );

    if (!answer) return;

    [
        "products", "sales", "locations", "workers", "activityLog",
        "inventoryRequests", "workerProfiles", "workerStatus", "workerIds",
        "incentives", "payrollRecords", "payrollHistory", "warehouseStock",
        "workerInventory", "warehouseMovements", "currentUserRole",
        "currentWorkerName", "adminSubscriptions", "upiPaymentId", "upiPayeeName",
        "paymentBankName", "paymentAccountHolder", "paymentAccountNumber",
        "paymentIfscCode", "upiQrDurationMinutes"
    ].forEach(removeWorkspaceItem);

    localStorage.removeItem(
        "sessionUser"
    );

    localStorage.removeItem("authSession");

    localStorage.removeItem(THEME_KEY);

    location.reload();

}

        connectSharedWorkspaceForSession(currentUserRole);
    } else if (!user) {
        stopSharedListeners();
    }
});

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        let reloadingForUpdate = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (reloadingForUpdate) return;
            reloadingForUpdate = true;
            window.location.reload();
        });

        navigator.serviceWorker.register("/service-worker.js")
            .then(registration => registration.update())
            .catch(error => console.warn("Offline app support is unavailable.", error));
    });
}
</script>
